name: Build VoidCarve (Windows VST3 + installer)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer .exe
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\VoidCarve.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: VoidCarve-Windows-Installer
          path: installer/Output/*.exe
